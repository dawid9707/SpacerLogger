name: Build SpacerLogger.apk

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # potrzebne tylko do publikacji APK w Releases (tag v*)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # instaluje Android SDK i akceptuje licencje (AGP dociągnie platformę 37 i build-tools)
      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Nazwa pliku SpacerLogger.apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/SpacerLogger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpacerLogger
          path: dist/SpacerLogger.apk

      - name: Release (tylko dla tagów v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SpacerLogger.apk
